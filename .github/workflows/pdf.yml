name: PDF bauen

# Laeuft bei jedem Push und laesst sich zusaetzlich manuell starten.
on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4

      - name: Arial-kompatible Schrift installieren
        # Arial ist proprietaer und auf Linux-Runnern nicht verfuegbar.
        # Liberation Sans ist der freie Ersatz mit Arial-kompatiblen
        # Zeichenbreiten.
        #
        # ACHTUNG: Das Ergebnis ist NICHT seitengleich zum lokalen Build mit
        # Arial. Der lokale Build auf macOS hat am 16.10.2026 19 Seiten; der
        # Umfang dieser Action kann davon abweichen, auch der Seitenumbruch
        # innerhalb langer Tabellen. Das Artefakt dieser Action ist daher eine
        # eigene Fassung, keine Kopie des lokalen PDFs. Wer abgibt, sollte
        # festlegen, welcher der beiden Builds die Abgabefassung ist.
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-liberation
          fc-cache -f

      - name: Typst einrichten
        uses: typst-community/setup-typst@v4
        with:
          typst-version: '0.15.1'

      - name: PDF kompilieren
        run: typst compile main.typ main.pdf

      - name: Vollstaendigkeit pruefen
        # Bricht den Build ab, wenn Regeln, Annahmen oder offene Punkte
        # verloren gehen. Stand 16.10.2026: 67 Regeln R3.0 bis R6.9
        # (R3.6a bis R3.6c zaehlen als eine Nummer), 22 Auslegungen und
        # Annahmen A1 bis A22, 22 offene Punkte O1 bis O22. Wer bewusst eine
        # Regel, Annahme oder einen offenen Punkt ergaenzt oder streicht,
        # zieht die Sollwerte hier mit.
        run: |
          regeln=$(grep -rhoE 'R[3-6]\.[0-9]+' chapters/ | sort -u | wc -l)
          annahmen=$(grep -rhoE '\[A[0-9]+\]' chapters/ | sort -u | wc -l)
          offene=$(grep -rhoE '\[O[0-9]+\]' chapters/ | sort -u | wc -l)
          echo "Regeln: $regeln (erwartet 67)"
          echo "Auslegungen/Annahmen: $annahmen (erwartet 22)"
          echo "Offene Punkte: $offene (erwartet 22)"
          if [ "$regeln" -ne 67 ] || [ "$annahmen" -ne 22 ] || [ "$offene" -ne 22 ]; then
            echo "::error::Anzahl weicht ab. Erwartet 67 Regeln, 22 Annahmen, 22 offene Punkte."
            exit 1
          fi

      - name: Quellen und Markdown-Spiegel abgleichen
        # spec-source.md muss denselben Inhalt fuehren wie chapters/. Der
        # Vergleich der Regel-IDs faengt den haeufigsten Fehler ab: eine Regel
        # wird nur in einer der beiden Fassungen geaendert oder umnummeriert.
        run: |
          if ! diff <(grep -rhoE 'R[3-6]\.[0-9]+[a-c]?' chapters/ | sort -u) \
                    <(grep -rhoE 'R[3-6]\.[0-9]+[a-c]?' spec-source.md | sort -u); then
            echo "::error::chapters/ und spec-source.md fuehren verschiedene Regel-IDs."
            exit 1
          fi

      - name: PDF als Artefakt hochladen
        uses: actions/upload-artifact@v4
        with:
          name: NGHR-Fachspezifikation
          path: main.pdf
          if-no-files-found: error
