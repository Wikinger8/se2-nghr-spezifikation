<svg xmlns="http://www.w3.org/2000/svg" viewBox="-2 -2 906 526" font-family="Arial, Helvetica, 'Liberation Sans', sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<defs>
<marker id="a" viewBox="0 0 10 10" refX="9.5" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
<path d="M0,0 L10,5 L0,10 z" fill="#222"/>
</marker>
</defs>
<rect x="0" y="0" width="900" height="520" fill="#ffffff"/>
<!-- Startpunkt und Anlegen -->
<circle cx="110" cy="22" r="8" fill="#222"/>
<line x1="110" y1="30" x2="110" y2="128" stroke="#222" stroke-width="1.4" marker-end="url(#a)"/>
<text x="122" y="56" font-size="12" fill="#222">Einstellung (R3.1) oder spätestens</text>
<text x="122" y="72" font-size="12" fill="#222">Zahltag des Vormonats (R3.2)</text>
<!-- Angelegt -->
<rect x="30" y="130" width="160" height="56" rx="14" fill="#f2f2f2" stroke="#222" stroke-width="1.4"/>
<text x="110" y="163" font-size="15" font-weight="bold" text-anchor="middle" fill="#222">Angelegt</text>
<!-- Angelegt -> Erstellt -->
<line x1="190" y1="158" x2="358" y2="158" stroke="#222" stroke-width="1.4" marker-end="url(#a)"/>
<text x="274" y="134" font-size="11.5" text-anchor="middle" fill="#222">Gehaltslauf</text>
<text x="274" y="149" font-size="11.5" text-anchor="middle" fill="#222">[≥ 1 aktiver Tag]</text>
<text x="274" y="176" font-size="11.5" text-anchor="middle" fill="#222">/ Lohnbuchungen zu</text>
<text x="274" y="191" font-size="11.5" text-anchor="middle" fill="#222">den Steuerpositionen</text>
<text x="274" y="206" font-size="10.5" text-anchor="middle" fill="#555">(R3.9, R3.10, R5.1)</text>
<!-- Angelegt -> Entfallen -->
<line x1="110" y1="186" x2="110" y2="328" stroke="#222" stroke-width="1.4" marker-end="url(#a)"/>
<text x="120" y="250" font-size="11.5" fill="#222">Gehaltslauf</text>
<text x="120" y="265" font-size="11.5" fill="#222">[kein aktiver Tag]</text>
<text x="120" y="280" font-size="10.5" fill="#555">(R3.11)</text>
<!-- Entfallen -->
<rect x="30" y="330" width="160" height="56" rx="14" fill="#f2f2f2" stroke="#222" stroke-width="1.4"/>
<text x="110" y="363" font-size="15" font-weight="bold" text-anchor="middle" fill="#222">Entfallen</text>
<!-- Erstellt (zusammengesetzter Zustand) -->
<rect x="360" y="80" width="510" height="272" rx="16" fill="#fafafa" stroke="#222" stroke-width="1.6"/>
<text x="376" y="102" font-size="15" font-weight="bold" fill="#222">Erstellt</text>
<line x1="360" y1="112" x2="870" y2="112" stroke="#222" stroke-width="1"/>
<!-- Bereich Zahlungsstatus -->
<text x="374" y="130" font-size="11" font-style="italic" fill="#555">Zahlungsstatus</text>
<circle cx="390" cy="172" r="6" fill="#222"/>
<line x1="396" y1="172" x2="418" y2="172" stroke="#222" stroke-width="1.4" marker-end="url(#a)"/>
<rect x="420" y="152" width="120" height="40" rx="10" fill="#ffffff" stroke="#222" stroke-width="1.4"/>
<text x="480" y="177" font-size="13" text-anchor="middle" fill="#222">offen</text>
<line x1="540" y1="172" x2="698" y2="172" stroke="#222" stroke-width="1.4" marker-end="url(#a)"/>
<text x="619" y="148" font-size="11.5" text-anchor="middle" fill="#222">Zahltag / Überweisungen,</text>
<text x="619" y="163" font-size="11.5" text-anchor="middle" fill="#222">Lohnbuchungen</text>
<text x="619" y="190" font-size="10.5" text-anchor="middle" fill="#555">(R5.3–R5.7, R5.8)</text>
<rect x="700" y="152" width="150" height="40" rx="10" fill="#ffffff" stroke="#222" stroke-width="1.4"/>
<text x="775" y="177" font-size="13" text-anchor="middle" fill="#222">ausgezahlt</text>
<!-- Trennlinie paralleler Bereiche -->
<line x1="360" y1="226" x2="870" y2="226" stroke="#222" stroke-width="1.2" stroke-dasharray="7 5"/>
<!-- Bereich Meldestatus -->
<text x="374" y="244" font-size="11" font-style="italic" fill="#555">Meldestatus</text>
<circle cx="390" cy="290" r="6" fill="#222"/>
<line x1="396" y1="290" x2="418" y2="290" stroke="#222" stroke-width="1.4" marker-end="url(#a)"/>
<rect x="420" y="270" width="120" height="40" rx="10" fill="#ffffff" stroke="#222" stroke-width="1.4"/>
<text x="480" y="295" font-size="13" text-anchor="middle" fill="#222">ungemeldet</text>
<line x1="540" y1="290" x2="698" y2="290" stroke="#222" stroke-width="1.4" marker-end="url(#a)"/>
<text x="619" y="266" font-size="11.5" text-anchor="middle" fill="#222">Steuermeldung gesendet</text>
<text x="619" y="308" font-size="10.5" text-anchor="middle" fill="#555">(R5.14)</text>
<rect x="700" y="270" width="150" height="40" rx="10" fill="#ffffff" stroke="#222" stroke-width="1.4"/>
<text x="775" y="295" font-size="13" text-anchor="middle" fill="#222">gemeldet</text>
<text x="374" y="340" font-size="10.5" fill="#555">Startzustände beider Bereiche: offen, ungemeldet (R3.10)</text>
<!-- Gelöscht -->
<rect x="520" y="440" width="170" height="56" rx="14" fill="#222" stroke="#222" stroke-width="1.4"/>
<text x="605" y="473" font-size="15" font-weight="bold" text-anchor="middle" fill="#ffffff">Gelöscht</text>
<line x1="690" y1="468" x2="736" y2="468" stroke="#222" stroke-width="1.4" marker-end="url(#a)"/>
<circle cx="752" cy="468" r="13" fill="none" stroke="#222" stroke-width="1.6"/>
<circle cx="752" cy="468" r="7" fill="#222"/>
<text x="772" y="472" font-size="11" fill="#555">Endzustand</text>
<!-- Erstellt -> Gelöscht -->
<line x1="605" y1="352" x2="605" y2="438" stroke="#222" stroke-width="1.4" marker-end="url(#a)"/>
<text x="615" y="384" font-size="11.5" fill="#222">Löschzeitpunkt erreicht</text>
<text x="615" y="399" font-size="11.5" fill="#222">/ Löschung aller Daten</text>
<text x="615" y="414" font-size="10.5" fill="#555">(R6.8, R6.9)</text>
<!-- Entfallen -> Gelöscht -->
<polyline points="110,386 110,456 518,456" fill="none" stroke="#222" stroke-width="1.4" marker-end="url(#a)"/>
<text x="300" y="448" font-size="11.5" text-anchor="middle" fill="#222">Löschzeitpunkt erreicht (R6.8)</text>
<!-- Angelegt -> Gelöscht -->
<polyline points="30,170 14,170 14,484 518,484" fill="none" stroke="#222" stroke-width="1.4" marker-end="url(#a)"/>
<text x="300" y="502" font-size="11.5" text-anchor="middle" fill="#222">Löschzeitpunkt erreicht (R6.8)</text>
</svg>
